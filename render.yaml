databases:
  - name: novel-signal-db
    databaseName: novel_signal
    user: novel_signal

services:
  - type: web
    name: novel-signal-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/live
    preDeployCommand: alembic -c apps/backend/alembic.ini upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: novel-signal-db
          property: connectionString
      - key: INTERNAL_AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://novel-signal-web.onrender.com
      - key: FRONTEND_URL
        value: https://novel-signal-web.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_ISSUER
        sync: false
      - key: SUPABASE_AUDIENCE
        value: authenticated
      - key: AUTH_ALLOW_EMAIL_FALLBACK_LINKING
        value: "false"
      - key: OBJECT_STORE_ENDPOINT
        sync: false
      - key: OBJECT_STORE_BUCKET
        value: novel-signal-raw
      - key: OBJECT_STORE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORE_SECRET_KEY
        sync: false
      - key: OBJECT_STORE_REGION
        value: ap-south-1
      - key: COLLECTION_BATCH_SIZE
        value: "50"
      - key: INTERNAL_SCHEDULER_ENABLED
        value: "true"
      - key: INTERNAL_SCHEDULER_INTERVAL_SECONDS
        value: "60"
      - key: PYTHON_VERSION
        value: 3.12.0
