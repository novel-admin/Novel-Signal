services:
  - type: web
    name: novel-signal-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: COLLECTION_BATCH_SIZE
        value: "50"
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: cron
    name: novel-signal-collector
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 * * * *"
    dockerCommand: python -m novel_signal.cli collect-due
    envVars:
      - key: APP_ENV
        value: production
      - key: COLLECTION_BATCH_SIZE
        value: "50"
